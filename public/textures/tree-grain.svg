<svg xmlns="http://www.w3.org/2000/svg" width="600" height="600" viewBox="0 0 600 600">
  <!-- Swirling wood grain inside the shade tree: indigo lines laid over the tree's red. Seamless tile. -->
  <filter id="grain" x="0" y="0" width="100%" height="100%" color-interpolation-filters="sRGB">
    <feTurbulence type="fractalNoise" baseFrequency="0.009 0.0028" numOctaves="3" seed="4" stitchTiles="stitch"/>
    <feColorMatrix type="matrix" values="0 0 0 0 0.106  0 0 0 0 0.169  0 0 0 0 0.278  3 0 0 0 -1"/>
    <feComponentTransfer><feFuncA type="table" tableValues="0 0 0.35 1 0.35 0 0 0 0.35 1 0.35 0 0 0 0.35 1 0.35 0 0 0 0.35 1 0.35 0 0 0 0.35 1 0.35 0 0 0 0.35 1 0.35 0 0 0 0.35 1 0.35 0"/></feComponentTransfer>
  </filter>
  <rect width="600" height="600" filter="url(#grain)" opacity="0.5"/>
</svg>
